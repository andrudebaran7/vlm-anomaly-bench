name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # a 3.11-only failure must not hide the 3.13 result, or vice versa
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - run: pytest -q

  # The real anomalib path (fit -> score) on CPU, at the pinned versions (review #25). Every
  # other test injects a fake backend; this one is what catches anomalib drifting under us.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchvision
      - run: pip install -r requirements-gpu.txt
      - run: pip install -e . --no-deps
      - run: pytest -q tests/test_integration_patchcore_cpu.py
