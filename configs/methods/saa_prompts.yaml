# SAA+ per-category prompts — PRE-REGISTERED (protocol §3 amendment v0.2.9)
#
# SAA+'s contribution is hybrid prompt regularization: per-object domain knowledge, consisting of
# defect language expressions plus object-specific property constraints (anomaly region area, size,
# position). Those prompts ARE the method, which is why protocol §3's verbatim-sourcing principle
# applies them here from the repo rather than a paper.
#
# **The paper confirms there was never another option** (2026-09-19, eighth pass of the paper
# repo's verified-literature-facts.md): arXiv:2305.10724v1 §5.1 says "Details about the prompts
# derived from domain expert knowledge are explained in the supplementary material", and no
# supplementary exists — v1 is the only version, 13 pages, ending at the references.
#
# THE CONDITION THAT MAKES THIS DEFENSIBLE — read before editing this file:
#   1. Every value below is copied VERBATIM from the official repo at the pinned commit recorded in
#      configs/methods/saa.yaml. Cite the exact file and line range you copied it from.
#   2. Nothing here is written, reworded or tuned by us.
#   3. Nothing here is changed after seeing any result, on any dataset. If a prompt turns out to be
#      wrong, the fix is to re-read the repo and record a dated correction — not to improve the prompt.
#   4. This file is committed BEFORE the first scoring run (Colab phase A.3, before phase C).
#
# If the repo has no prompt for one of our categories (MVTec AD 2 categories are not MVTec AD classic
# categories), do NOT invent one. Record `prompt: NOT_PUBLISHED_IN_REPO` and the fallback the repo's
# own code uses for an unknown object, and note it in results/reproduction/saa_visa.md — an invented
# prompt would be exactly the per-category engineering §3 forbids. Any category left on the repo's
# fallback is reported on every table as "SAA+ without its per-object prompts", never as SAA+ proper
# (protocol §3, v0.2.9).
#
# ⚠️ THE PROPERTY CONSTRAINT IS A POSITIONAL FORMAT, NOT PROSE. Found 2026-09-19 in
# `SAA/model.py`: `set_property_text_prompts` indexes whitespace-separated tokens by position —
# [5] object count, [6] similar/dissimilar, [7] object, [12] k_mask, [19] area threshold. Re-wrapping
# one of these strings, collapsing a double space or dropping the trailing space silently changes a
# threshold to whatever token lands at index 19, with no error and a complete, plausible run at
# parameters nobody chose. **They are stored as double-quoted scalars so every byte, including the
# trailing space, is visible and unambiguous**, and `tests/test_saa_prompts.py` re-parses each one at
# those five indices. That is also why `prompt_pairs` is a list of explicit two-item lists rather
# than one block of pasted text: the repo's structure is `[prompt, filtered phrase]` and flattening
# it would lose which half is which.
#
# Do NOT collapse a category into a flow mapping (`{prompt: ..., property_constraints: ...}`):
# the pasted text routinely contains commas and colons, and PyYAML's flow-mapping parser either
# silently truncates at the comma (producing a junk key with no error) or raises on the colon.
# `configs/methods/mllm_qwen.yaml` carries the same warning for the same reason.

# RECORDED 2026-09-19, on CPU, from the official repo read directly — NOT deferred to Colab.
# Reading it early is what turned up the branch below, and the branch is the difference between
# SAA+ and SAA (published VisA Fp 27.07 vs 12.76).
source_branch: SAA-plus             # ⚠️ NOT `master`, which holds only the vanilla SAA demo
source_commit: ff564ed09bef91d86452f62aa1564e778580513e     # SAA-plus HEAD, 2025-02-22
source_files: "SAA/prompts/visa_parameters.py, SAA/prompts/general_prompts.py, SAA/hybrid_prompts.py"
recorded_on: 2026-09-19
# `SAA/hybrid_prompts.py` keys its tables by DATASET — visa_public, visa_challenge, mvtec, ksdd2,
# mtd — and uses `manual_prompts` + `property_prompts`. Two consequences recorded here:
#   - MVTec AD 2 is an ABSENT DATASET, not a category that falls back. See `categories:` below.
#   - `visa_parameters.py` also defines `official_prompts` (VisA's own defect-type labels). It is
#     imported NOWHERE. It is the larger and more official-looking of the two tables in that file,
#     and it is the dead one. Do not take prompts from it.
unused_table_in_source: official_prompts

# --- MVTec AD 2 (the primary evaluation) -------------------------------------------------------
# COVERAGE: 0 of 8. The repo publishes parameters for MVTec AD classic (15), VisA (12), KSDD2 and
# MTD, and nothing else — exactly the realistic outcome protocol v0.2.9 pre-registered. Every
# category below therefore runs on the repo's own generic fallback, `build_general_prompts`, which
# in full is:
#
#     general_anomaly_description = ['defect on {}', 'damage on {}', 'flaw on {}']
#     def build_general_prompts(category):
#         return [[f.format(category), category] for f in general_anomaly_description]
#
# There is no property constraint in the fallback at all: `property_prompts` has no MVTec AD 2
# entry, so the §4.1.2 rules (object count, k_mask, area threshold) have no published values here.
# That is a larger gap than the language prompts, because those rules are what P^P contributes.
categories:
  can: &not_published
    prompt: NOT_PUBLISHED_IN_REPO
    fallback_prompt_pairs: |
      build_general_prompts(<category>) -> [["defect on <category>", "<category>"],
                                            ["damage on <category>", "<category>"],
                                            ["flaw on <category>", "<category>"]]
    property_constraints: NOT_PUBLISHED_IN_REPO
    copied_from: "SAA/prompts/general_prompts.py L1-L9; absent from SAA/hybrid_prompts.py's tables"
  fabric: *not_published
  fruit_jelly: *not_published
  rice: *not_published
  sheet_metal: *not_published
  vial: *not_published
  wallplugs: *not_published
  walnuts: *not_published

