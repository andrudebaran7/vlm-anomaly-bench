[project]
name = "vlmab"
version = "0.0.1"
description = "Zero-shot & VLM anomaly detection benchmark on MVTec AD 2"
requires-python = ">=3.10"
# The core the CPU pipeline imports; requirements.txt carries the same list for a plain venv.
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "pyarrow>=14",
  "pillow>=10",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Pinned to the versions every reported number was produced with (requirements-gpu.txt).
gpu = ["torch==2.11.0", "anomalib[clip]==2.6.0", "open-clip-torch==2.24.0"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
